<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Firebase Chat Panel</title>
  <link rel="stylesheet" href="styles.css">
  <script src="firebase/firebase-app-compat.js"></script>
  <script src="firebase/firebase-database-compat.js"></script>
  <script defer src="sidepanel.js"></script>
</head>
<body>

  <!-- Giriş Ekranı -->
  <div id="login-screen">
    <h2>Giriş Yap</h2>
    <input type="email" id="email" placeholder="E-posta" required />
    <input type="password" id="password" placeholder="Şifre" required />
    <button id="loginBtn">Giriş Yap</button>
    <p class="switch-screen">Hesabın yok mu? <a href="#" id="showSignup">Kayıt Ol</a></p>
    <p id="status"></p>
  </div>

  <!-- Kayıt Ol Ekranı -->
  <div id="signup-screen" class="hidden">
    <h2>Kayıt Ol</h2>
    <input type="email" id="signup-email" placeholder="E-posta" required />
    <input type="password" id="signup-password" placeholder="Şifre" required />
    <input type="text" id="nickname" placeholder="Takma Ad (Nickname)" required />
    <button id="signupBtn">Kayıt Ol</button>
    <p class="switch-screen">Zaten hesabın var mı? <a href="#" id="showLogin">Giriş Yap</a></p>
  </div>

  <!-- Ana Uygulama Ekranı -->
  <div id="app-container" class="hidden">
    <!-- Kullanıcı Bilgisi -->
    <div id="user-info">
      <p id="welcomeMsg"></p>
      <button id="logoutBtn">Çıkış Yap</button>
    </div>
    
    <!-- Kod Oluşturma Bölümü -->
    <div id="code-creation-section">
      <div class="room-buttons">
        <button id="createVideoChatCodeBtn" class="primary-button video-btn">Video Kodu Oluştur</button>
        <button id="createChatCodeBtn" class="primary-button chat-btn">Chat Kodu Oluştur</button>
      </div>
      
      <div id="videoCodeDisplay" class="code-display hidden">
        <p>Video Kodu: <span id="generatedVideoCode">-</span> 
          <button id="copyVideoCodeBtn" class="copy-btn">Kopyala</button>
        </p>
      </div>
      
      <div id="chatCodeDisplay" class="code-display hidden">
        <p>Chat Kodu: <span id="generatedChatCode">-</span>
          <button id="copyChatCodeBtn" class="copy-btn">Kopyala</button>
        </p>
      </div>
    </div>
    
    <!-- Kod Giriş Bölümü -->
    <div id="code-entry-section">
      <div class="code-entry">
        <input id="videoCodeInput" placeholder="Video Kodu" />
        <button id="joinVideoRoomBtn">Video Odasına Katıl</button>
      </div>
      
      <div class="code-entry">
        <input id="chatCodeInput" placeholder="Chat Kodu" />
        <button id="joinChatRoomBtn">Chat Odasına Katıl</button>
      </div>
    </div>

    <!-- Video Chat Container (Başlangıçta Gizli) -->
    <div id="video-chat-container" class="hidden">
      <div class="video-header">
        <h3>Video Görüşmesi</h3>
        <button id="closeVideoChat" class="close-button">Kapat</button>
      </div>
      <div class="videos">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
      <div class="controls">
        <button id="startButton">Kamerayı Başlat</button>
        <button id="hangupButton" disabled>Sonlandır</button>
      </div>
      <div id="roomInfo">
        <p>Oda Kodu: <span id="currentVideoCode">---</span></p>
        <p>Durum: <span id="videoStatus">Başlamak için kamerayı başlat</span></p>
      </div>
    </div>
    
    <!-- Chat Container (Başlangıçta Gizli) -->
    <div id="chat-container" class="hidden">
      <div class="chat-header">
        <h3>Chat Odası</h3>
        <button id="closeChatRoom" class="close-button">Kapat</button>
      </div>
      <p id="chatRoomInfo">Oda Kodu: <span id="currentChatCode">---</span></p>
      
      <!-- Mesajları Gösteren Alan -->
      <div id="messages-container"></div>

      <!-- Mesaj Yazma Alanı -->
      <div id="message-box">
        <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." />
        <button id="sendMessageBtn">Gönder</button>
      </div>
    </div>
  </div>

</body>
</html>
