<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Firebase Chat Panel</title>
  <link rel="stylesheet" href="styles.css">
  <script src="firebase/firebase-app-compat.js"></script>
  <script src="firebase/firebase-database-compat.js"></script>
  <script defer src="sidepanel.js"></script>
</head>
<body>

  <!-- Giriş Ekranı -->
  <div id="login-screen">
    <h2>Giriş Yap</h2>
    <input type="email" id="email" placeholder="E-posta" required />
    <input type="password" id="password" placeholder="Şifre" required />
    <button id="loginBtn">Giriş Yap</button>
    <p class="switch-screen">Hesabın yok mu? <a href="#" id="showSignup">Kayıt Ol</a></p>
    <p id="status"></p>
  </div>

  <!-- Kayıt Ol Ekranı -->
  <div id="signup-screen" class="hidden">
    <h2>Kayıt Ol</h2>
    <input type="email" id="signup-email" placeholder="E-posta" required />
    <input type="password" id="signup-password" placeholder="Şifre" required />
    <input type="text" id="nickname" placeholder="Takma Ad (Nickname)" required />
    <button id="signupBtn">Kayıt Ol</button>
    <p class="switch-screen">Zaten hesabın var mı? <a href="#" id="showLogin">Giriş Yap</a></p>
  </div>

  <!-- Ana Uygulama Ekranı -->
  <div id="app-container" class="hidden">
    <!-- Kullanıcı Bilgisi -->
    <div id="user-info">
      <p id="welcomeMsg"></p>
      <button id="logoutBtn">Çıkış Yap</button>
    </div>
    
    <!-- Video Görüşme Bölümü -->
    <div id="video-chat-section">
      <div class="video-chat-info">
        <h3>Video Görüşmesi</h3>
      </div>
      
      <div class="video-controls">
        <button id="openVideoChatBtn" class="primary-button">Video Görüşmesi Başlat</button>
      </div>
      
      <div class="room-controls hidden" id="roomControlsSection">
        <input id="roomIdInput" placeholder="Oda ID" />
        <button id="joinRoomBtn">Katıl</button>
        <button id="copyRoomIdBtn">Kopyala</button>
      </div>
    </div>

    <!-- Video Chat Container (Başlangıçta Gizli) -->
    <div id="video-chat-container" class="hidden">
      <div class="video-header">
        <h3>Video Görüşmesi</h3>
        <button id="collapseVideoChat" class="back-button">Gizle</button>
      </div>
      <div class="videos">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
      <div class="controls">
        <button id="startButton">Kamerayı Başlat</button>
        <button id="hangupButton" disabled>Sonlandır</button>
      </div>
      <div id="roomInfo">
        <p>Oda ID: <span id="roomIdDisplay">---</span></p>
        <p>Durum: <span id="videoStatus">Başlamak için kamerayı başlat</span></p>
      </div>
    </div>
    
    <!-- Chat Ekranı -->
    <div id="chat-screen">
      <h3>Mesajlar</h3>
      <!-- Mesajları Gösteren Alan -->
      <div id="messages-container"></div>

      <!-- Mesaj Yazma Alanı -->
      <div id="message-box">
        <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." />
        <button id="sendMessageBtn">Gönder</button>
      </div>
    </div>
  </div>

</body>
</html>
